<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0f2027"/>

  <!-- Gradient defs -->
  <defs>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#63cafd"/>
      <stop offset="100%" stop-color="#2a7fb5"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8edff"/>
      <stop offset="100%" stop-color="#63cafd"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#63cafd"/>
      <stop offset="100%" stop-color="#1a5f8a"/>
    </linearGradient>
    <linearGradient id="snowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a8edff"/>
    </linearGradient>
  </defs>

  <!-- Grid lines (subtle) -->
  <line x1="80" y1="370" x2="432" y2="370" stroke="rgba(99,202,253,0.15)" stroke-width="2"/>
  <line x1="80" y1="300" x2="432" y2="300" stroke="rgba(99,202,253,0.1)" stroke-width="1.5"/>
  <line x1="80" y1="230" x2="432" y2="230" stroke="rgba(99,202,253,0.1)" stroke-width="1.5"/>
  <line x1="80" y1="160" x2="432" y2="160" stroke="rgba(99,202,253,0.1)" stroke-width="1.5"/>

  <!-- Bar 1 (short) -->
  <rect x="108" y="290" width="60" height="80" rx="10" fill="url(#barGrad3)" opacity="0.85"/>

  <!-- Bar 2 (tall) -->
  <rect x="198" y="170" width="60" height="200" rx="10" fill="url(#barGrad2)"/>

  <!-- Bar 3 (medium) -->
  <rect x="288" y="230" width="60" height="140" rx="10" fill="url(#barGrad1)" opacity="0.9"/>

  <!-- Bar 4 (medium-short) -->
  <rect x="378" y="260" width="60" height="110" rx="10" fill="url(#barGrad3)" opacity="0.75"/>

  <!-- Trend line over bars -->
  <polyline
    points="138,290 228,200 318,250 408,268"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.6"
  />
  <!-- Trend line dots -->
  <circle cx="138" cy="290" r="7" fill="white" opacity="0.7"/>
  <circle cx="228" cy="200" r="7" fill="white" opacity="0.7"/>
  <circle cx="318" cy="250" r="7" fill="white" opacity="0.7"/>
  <circle cx="408" cy="268" r="7" fill="white" opacity="0.7"/>

  <!-- Snowflake watermark top-right -->
  <g transform="translate(390, 100)" opacity="0.35">
    <line x1="0" y1="-28" x2="0" y2="28"   stroke="url(#snowGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-28" y1="0" x2="28" y2="0"   stroke="url(#snowGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="url(#snowGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="-20" x2="-20" y2="20" stroke="url(#snowGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="7" fill="white"/>
  </g>

  <!-- Bottom baseline -->
  <line x1="80" y1="370" x2="432" y2="370" stroke="rgba(99,202,253,0.4)" stroke-width="3" stroke-linecap="round"/>

  <!-- "S" wordmark top-left -->
  <text x="90" y="128" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#63cafd" opacity="0.9">S</text>
</svg>
