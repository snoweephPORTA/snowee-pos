<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#234a87"/>
      <stop offset="100%" stop-color="#0f2347"/>
    </radialGradient>
    <radialGradient id="waffleGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
    <clipPath id="circle">
      <circle cx="256" cy="185" r="118"/>
    </clipPath>
    <clipPath id="sclip">
      <rect x="62" y="380" width="60" height="100"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Yellow waffle circle -->
  <circle cx="256" cy="185" r="118" fill="url(#waffleGrad)" filter="url(#shadow)"/>

  <!-- Waffle grid clipped -->
  <g clip-path="url(#circle)" stroke="#C8A800" stroke-width="4" opacity="0.45">
    <line x1="138" y1="148" x2="374" y2="148"/>
    <line x1="138" y1="176" x2="374" y2="176"/>
    <line x1="138" y1="204" x2="374" y2="204"/>
    <line x1="138" y1="232" x2="374" y2="232"/>
    <line x1="138" y1="260" x2="374" y2="260"/>
    <line x1="172" y1="67" x2="172" y2="303"/>
    <line x1="200" y1="67" x2="200" y2="303"/>
    <line x1="228" y1="67" x2="228" y2="303"/>
    <line x1="256" y1="67" x2="256" y2="303"/>
    <line x1="284" y1="67" x2="284" y2="303"/>
    <line x1="312" y1="67" x2="312" y2="303"/>
    <line x1="340" y1="67" x2="340" y2="303"/>
  </g>

  <!-- Soft serve swirl -->
  <path d="M256 168
    C270 160 278 148 274 136
    C270 124 258 118 248 122
    C238 126 232 138 236 149
    C240 160 252 163 259 157
    C266 151 264 142 257 139
    C250 136 245 142 247 149"
    fill="none" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <path d="M256 168
    C270 160 278 148 274 136
    C270 124 258 118 248 122
    C238 126 232 138 236 149
    C240 160 252 163 259 157
    C266 151 264 142 257 139
    C250 136 245 142 247 149"
    fill="none" stroke="#F8F8F8" stroke-width="13" stroke-linecap="round"/>
  <ellipse cx="256" cy="170" rx="16" ry="9" fill="white"/>

  <!-- Cone -->
  <polygon points="256,303 220,400 292,400" fill="#F5A32A" filter="url(#shadow)"/>
  <polygon points="256,303 220,400 256,368" fill="#D4841A" opacity="0.5"/>

  <!-- SNOWEE white text -->
  <text x="256" y="470"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="88"
    fill="white"
    text-anchor="middle"
    letter-spacing="-1">SNOWEE</text>

  <!-- Yellow S only -->
  <text x="256" y="470"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="88"
    fill="#FFD700"
    text-anchor="middle"
    letter-spacing="-1"
    clip-path="url(#sclip)">SNOWEE</text>
</svg>
