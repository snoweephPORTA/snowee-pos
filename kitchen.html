<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snowee Kitchen</title>
<meta name="theme-color" content="#1B3A6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="manifest" href="kitchen-manifest.json">
<link rel="apple-touch-icon" href="kitchen-icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B3A6B;--navy2:#234a87;--yellow:#FFD700;--green:#22C55E;--red:#EF4444;--orange:#F97316;--gray:#6B7A99;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'Nunito',sans-serif;background:#0a1628;color:#fff;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100%;}
.topbar{background:var(--navy);border-bottom:3px solid var(--yellow);padding:0 14px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.logo{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--yellow);}
.logo span{color:rgba(255,255,255,.5);font-size:12px;font-family:'Nunito',sans-serif;font-weight:800;margin-left:4px;}
.topright{display:flex;align-items:center;gap:8px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex-shrink:0;}
.dot.off{background:var(--red);box-shadow:0 0 8px var(--red);}
.clock{font-family:'Black Han Sans',sans-serif;font-size:18px;color:var(--yellow);}
.sync-lbl{font-size:9px;font-weight:800;color:rgba(255,255,255,.35);}

.tabbar{background:var(--navy);display:flex;padding:8px 10px;gap:8px;flex-shrink:0;}
.tabbtn{flex:1;border:2px solid rgba(255,215,0,.2);border-radius:12px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);font-family:'Black Han Sans',sans-serif;font-size:14px;padding:10px 4px;cursor:pointer;text-align:center;position:relative;}
.tabbtn.active{background:var(--yellow);border-color:var(--yellow);color:var(--navy);}
.tbadge{position:absolute;top:-7px;right:-7px;background:var(--red);color:white;font-size:10px;font-weight:900;width:20px;height:20px;border-radius:50%;display:none;align-items:center;justify-content:center;}
.statsbar{display:flex;gap:6px;padding:8px 10px 0;flex-shrink:0;}
.si{flex:1;background:var(--navy);border-radius:10px;padding:7px 4px;text-align:center;}
.si-num{font-family:'Black Han Sans',sans-serif;font-size:17px;color:var(--yellow);}
.si-lbl{font-size:8px;font-weight:800;color:rgba(255,255,255,.35);text-transform:uppercase;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;}
.panel{display:none;flex-direction:column;gap:10px;}
.panel.active{display:flex;}
.kcard{background:var(--navy);border-radius:16px;border:2px solid rgba(255,215,0,.15);overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.3);animation:popIn .25s ease;}
.kcard.urgent{border-color:var(--red);box-shadow:0 0 20px rgba(239,68,68,.35);}
.kcard.warning{border-color:var(--orange);box-shadow:0 0 14px rgba(249,115,22,.25);}
.kcard.done-card{background:#0d1f0d;border-color:rgba(34,197,94,.2);opacity:.8;}
@keyframes popIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,215,0,.7);}70%{box-shadow:0 0 0 14px rgba(255,215,0,0);}100%{box-shadow:0 0 0 0 rgba(255,215,0,0);}}
.kcard.neworder{animation:popIn .25s ease,pulse .8s ease .25s 2;}
.khd{background:var(--navy2);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;}
.kcard.urgent .khd{background:#450a0a;}
.kcard.warning .khd{background:#431407;}
.kcard.done-card .khd{background:#052e16;}
.knum{font-family:'Black Han Sans',sans-serif;font-size:28px;color:var(--yellow);}
.kcard.done-card .knum{color:var(--green);}
.kright{display:flex;align-items:center;gap:8px;}
.ktimer{font-family:'Black Han Sans',sans-serif;font-size:20px;}
.kstatus{font-family:'Black Han Sans',sans-serif;font-size:11px;padding:4px 12px;border-radius:20px;}
.kstatus.pend{background:var(--yellow);color:var(--navy);}
.kstatus.done{background:var(--green);color:white;}
.ktimes{padding:6px 14px 8px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;gap:14px;flex-wrap:wrap;}
.kt{display:flex;flex-direction:column;gap:1px;}
.kt-lbl{font-size:9px;font-weight:800;color:rgba(255,255,255,.35);text-transform:uppercase;}
.kt-val{font-size:12px;font-weight:900;color:white;}
.kbody{padding:10px 14px;}
.kitem{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.kitem:last-child{border-bottom:none;}
.kqty{font-family:'Black Han Sans',sans-serif;font-size:22px;color:var(--yellow);min-width:36px;}
.kcard.done-card .kqty{color:var(--green);}
.kname{font-size:16px;font-weight:800;}
.kcard.done-card .kname{color:rgba(255,255,255,.5);}
.kft{padding:8px 14px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between;}
.kpay{font-size:11px;font-weight:800;color:rgba(255,255,255,.35);}
.kdur{font-size:11px;font-weight:800;}
.empty{text-align:center;padding:60px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.empty-emoji{font-size:64px;}
.empty-txt{font-family:'Black Han Sans',sans-serif;font-size:18px;color:rgba(255,255,255,.25);}
.empty-sub{font-size:13px;font-weight:800;color:rgba(255,255,255,.15);}
.loading{text-align:center;padding:50px;}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--yellow);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-txt{font-size:14px;font-weight:800;color:rgba(255,255,255,.3);}
.setup-screen{display:none;position:fixed;inset:0;background:#0a1628;z-index:100;flex-direction:column;align-items:center;justify-content:center;padding:30px;gap:20px;}
.setup-screen.show{display:flex;}
.setup-title{font-family:'Black Han Sans',sans-serif;font-size:28px;color:var(--yellow);text-align:center;}
.setup-sub{font-size:14px;font-weight:700;color:rgba(255,255,255,.5);text-align:center;line-height:1.6;}
.setup-input{width:100%;max-width:500px;background:var(--navy);border:2px solid rgba(255,215,0,.3);border-radius:12px;padding:14px 16px;font-size:13px;font-weight:700;color:white;outline:none;font-family:'Nunito',sans-serif;}
.setup-btn{background:var(--yellow);color:var(--navy);font-family:'Black Han Sans',sans-serif;font-size:18px;padding:14px 40px;border-radius:14px;border:none;cursor:pointer;width:100%;max-width:500px;}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--yellow);font-weight:900;font-size:12px;padding:8px 18px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:999;border:2px solid var(--yellow);white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">🍳 snowee <span>Kitchen</span></div>
    <div class="topright">
      <div class="sync-lbl" id="sync-lbl">—</div>
      <button onclick="load(false)" style="background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:8px;color:var(--yellow);font-size:11px;font-weight:800;padding:5px 10px;cursor:pointer;">↻ Refresh</button>
      <div class="dot" id="dot"></div>
      <div class="clock" id="clock">—</div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tabbtn active" id="tbtn-pending" onclick="switchTab('pending')">
      ⏳ Pending
      <div class="tbadge" id="tbadge">0</div>
    </button>
    <button class="tabbtn" id="tbtn-done" onclick="switchTab('done')">✅ Done</button>
  </div>
  <div class="statsbar">
    <div class="si"><div class="si-num" id="s-pending">0</div><div class="si-lbl">Pending</div></div>
    <div class="si"><div class="si-num" id="s-done">0</div><div class="si-lbl">Done</div></div>
    <div class="si"><div class="si-num" id="s-total">0</div><div class="si-lbl">Today</div></div>
    <div class="si"><div class="si-num" id="s-avg">—</div><div class="si-lbl">Avg Time</div></div>
  </div>
  <div class="content">
    <div class="panel active" id="panel-pending">
      <div class="loading"><div class="spinner"></div><div class="loading-txt">Loading orders...</div></div>
    </div>
    <div class="panel" id="panel-done">
      <div class="loading"><div class="spinner"></div><div class="loading-txt">Loading orders...</div></div>
    </div>
  </div>
</div>

<div class="setup-screen" id="setup-screen">
  <div class="setup-title">🍳 Snowee Kitchen</div>
  <div class="setup-sub">Paste your Google Apps Script URL below.<br>You only need to do this once!</div>
  <input class="setup-input" id="script-url-input" type="url" placeholder="https://script.google.com/macros/s/...">
  <button class="setup-btn" onclick="saveUrl()">✅ Connect to Kitchen</button>
</div>

<div class="toast" id="toast"></div>

<script>
const REFRESH=30;
const KEY='snowee_kitchen_script_url';
let url=localStorage.getItem(KEY)||'';
let rows=[],tab='pending',countdown=REFRESH,knownQ=new Set(),cardT={},interval=null;

function init(){
  updateClock();setInterval(updateClock,1000);
  if(!url){document.getElementById('setup-screen').classList.add('show');return;}
  load(false);
}

function saveUrl(){
  const v=document.getElementById('script-url-input').value.trim();
  if(!v.startsWith('https://script.google.com')){toast('❌ Invalid URL');return;}
  url=v;localStorage.setItem(KEY,url);
  document.getElementById('setup-screen').classList.remove('show');
  load(false);
}

function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:true});}

function today(){return new Date().toISOString().split('T')[0];}

function fixDate(d){
  if(!d)return'';const s=String(d);
  if(s.includes('T'))return s.split('T')[0];
  if(s.includes('/')){const p=s.split('/');if(p.length===3)return p[2]+'-'+p[0].padStart(2,'0')+'-'+p[1].padStart(2,'0');}
  return s;
}

async function load(silent=true){
  try{
    const res=await fetch(url+'?t='+Date.now());
    const json=await res.json();
    if(json.status==='ok'){
      const t=today();
      rows=json.rows.filter(r=>fixDate(String(r.date))===t);
      document.getElementById('dot').className='dot';
      document.getElementById('sync-lbl').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
      detectNew();renderAll();
      if(!silent)toast('✅ '+rows.length+' rows loaded!');
    }else throw new Error();
  }catch(e){
    document.getElementById('dot').className='dot off';
    if(!silent)toast('❌ Cannot reach Google Sheets');
  }
}

function buildOrders(r){
  const m={};
  r.forEach(row=>{
    const k=String(row.queue);
    if(!m[k])m[k]={qNum:k,timeCreated:row.timeCreated||row.time||'',timeDone:row.timeDone||'',done:false,payment:row.payment||'',customer:row.customer||'',total:parseFloat(row.order_total)||0,durationSecs:0,items:[]};
    if(row.timeDone&&String(row.timeDone).trim()!==''){m[k].done=true;m[k].timeDone=row.timeDone;m[k].durationSecs=parseFloat(row.durationSecs)||0;}
    if(!m[k].items.find(i=>i.name===row.item))m[k].items.push({name:row.item||'',qty:parseInt(row.qty)||1});
  });
  return Object.values(m).sort((a,b)=>{
    try{return new Date(b.timeCreated).getTime()-new Date(a.timeCreated).getTime();}catch(e){return 0;}
  });
}

function detectNew(){
  const orders=buildOrders(rows);
  const pq=new Set(orders.filter(o=>!o.done).map(o=>o.qNum));
  if(knownQ.size>0)[...pq].filter(n=>!knownQ.has(n)).forEach(n=>toast('🆕 New Order: '+n+'!'));
  knownQ=pq;
}

function renderAll(){
  const orders=buildOrders(rows);
  const pending=orders.filter(o=>!o.done);
  const done=orders.filter(o=>o.done);
  document.getElementById('s-pending').textContent=pending.length;
  document.getElementById('s-done').textContent=done.length;
  document.getElementById('s-total').textContent=orders.length;
  const timed=done.filter(o=>o.durationSecs>0);
  const avg=timed.length?timed.reduce((s,o)=>s+o.durationSecs,0)/timed.length:0;
  document.getElementById('s-avg').textContent=avg>0?Math.floor(avg/60)+'m'+Math.round(avg%60)+'s':'—';
  const badge=document.getElementById('tbadge');
  badge.textContent=pending.length;badge.style.display=pending.length>0?'flex':'none';
  renderPending(pending);renderDone(done);
}

function elapsed(t){
  if(!t)return{secs:0,label:'0s'};
  try{const d=Math.max(0,Math.floor((Date.now()-new Date(t).getTime())/1000));if(d<60)return{secs:d,label:d+'s'};return{secs:d,label:Math.floor(d/60)+'m '+(d%60)+'s'};}
  catch(e){return{secs:0,label:'—'};}
}
function urgClass(s){return s>=600?'urgent':s>=300?'warning':'';}
function tColor(s){return s>=600?'#EF4444':s>=300?'#F97316':'#22C55E';}
function fmtT(t){if(!t||String(t).trim()==='')return'—';try{return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});}catch(e){return String(t);}}

function renderPending(pending){
  const el=document.getElementById('panel-pending');
  if(!pending.length){el.innerHTML='<div class="empty"><div class="empty-emoji">✅</div><div class="empty-txt">All orders done!</div><div class="empty-sub">Waiting for new orders...</div></div>';stopCardTimers();return;}
  el.innerHTML=pending.map(o=>{const{secs,label}=elapsed(o.timeCreated);const urg=urgClass(secs);const c=tColor(secs);
  return`<div class="kcard ${urg}" id="kc-${o.qNum}"><div class="khd"><div class="knum">${o.qNum}</div><div class="kright"><div class="ktimer" id="kt-${o.qNum}" style="color:${c}">${label}</div><div class="kstatus pend">⏳ Pending</div></div></div><div class="ktimes"><div class="kt"><div class="kt-lbl">Ordered</div><div class="kt-val">${fmtT(o.timeCreated)}</div></div>${o.customer?`<div class="kt"><div class="kt-lbl">Customer</div><div class="kt-val">${o.customer}</div></div>`:''}</div><div class="kbody">${o.items.map(i=>`<div class="kitem"><div class="kqty">${i.qty}x</div><div class="kname">${i.name}</div></div>`).join('')}</div><div class="kft"><div class="kpay">${o.payment==='GCash'?'📱 GCash':'💵 Cash'} · ₱${o.total}</div><div class="kdur" id="kd-${o.qNum}" style="color:${c}">⏱ ${label}</div></div></div>`;}).join('');
  startCardTimers(pending);
}

function startCardTimers(pending){
  stopCardTimers();
  pending.forEach(o=>{
    cardT[o.qNum]=setInterval(()=>{
      const te=document.getElementById('kt-'+o.qNum);const de=document.getElementById('kd-'+o.qNum);const ce=document.getElementById('kc-'+o.qNum);
      if(!te||!ce){clearInterval(cardT[o.qNum]);return;}
      const{secs,label}=elapsed(o.timeCreated);const c=tColor(secs);
      te.textContent=label;te.style.color=c;
      if(de){de.textContent='⏱ '+label;de.style.color=c;}
      ce.className='kcard'+(urgClass(secs)?' '+urgClass(secs):'');
    },1000);
  });
}
function stopCardTimers(){Object.values(cardT).forEach(t=>clearInterval(t));cardT={};}

function renderDone(done){
  const el=document.getElementById('panel-done');
  if(!done.length){el.innerHTML='<div class="empty"><div class="empty-emoji">📋</div><div class="empty-txt">No completed orders</div><div class="empty-sub">Done orders appear here</div></div>';return;}
  el.innerHTML=done.map(o=>{const dur=o.durationSecs>0?Math.floor(o.durationSecs/60)+'m '+Math.round(o.durationSecs%60)+'s':'—';
  return`<div class="kcard done-card"><div class="khd"><div class="knum">${o.qNum}</div><div class="kright"><div class="ktimer" style="color:var(--green)">⏱ ${dur}</div><div class="kstatus done">✅ Done</div></div></div><div class="ktimes"><div class="kt"><div class="kt-lbl">Ordered</div><div class="kt-val">${fmtT(o.timeCreated)}</div></div><div class="kt"><div class="kt-lbl">Done</div><div class="kt-val" style="color:var(--green)">${fmtT(o.timeDone)}</div></div>${o.customer?`<div class="kt"><div class="kt-lbl">Customer</div><div class="kt-val">${o.customer}</div></div>`:''}</div><div class="kbody">${o.items.map(i=>`<div class="kitem"><div class="kqty">${i.qty}x</div><div class="kname">${i.name}</div></div>`).join('')}</div><div class="kft"><div class="kpay">${o.payment==='GCash'?'📱 GCash':'💵 Cash'} · ₱${o.total}</div><div class="kdur" style="color:var(--green)">✅ Completed</div></div></div>`;}).join('');
}

function switchTab(t){
  tab=t;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+t).classList.add('active');
  document.getElementById('tbtn-'+t).classList.add('active');
}

function startCountdown(){}
function updateProgress(){}

let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800);}

init();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('kitchen-sw.js')
      .then(r=>console.log('Kitchen SW registered'))
      .catch(e=>console.log('Kitchen SW error:',e));
  });
}
</script>
</body>
</html>
